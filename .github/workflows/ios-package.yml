name: iOS package (unsigned .ipa)

# ─────────────────────────────────────────────────────────────
# 手动触发，产未签名 .ipa 供 Sideloadly 装真机。
#
# ⚠️ 不要改成 push 触发。macOS runner 是 10× 计费，
#    每次推送都打一次包会迅速烧光每月约 200 分钟的额度。
#
# 真机流程：
#   Actions 页面手动 Run → 从 Release 下载 .ipa → Sideloadly 装机
#   （免费 Apple ID 签的应用 7 天过期，过期后重新下载安装即可）
#
# ⚠️ 走 Release 而不是 actions/upload-artifact：2026-09-27 起账号级的
#    Actions 产物配额一直被拒（`Artifact storage quota has been hit`），
#    而那个计数**滞后 6~12 小时**，删产物/删 cache 都当场无效 ——
#    实测删光全部 cache 后仍是同一句。Release 资源不占 Actions 产物配额。
# ─────────────────────────────────────────────────────────────

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '构建号（留空则用 pubspec 里的）'
        required: false
        type: string
      flavor:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - profile

concurrency:
  group: ios-package
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 检测 iOS 工程
        id: probe
        run: |
          if [ -d ios ] && [ -f pubspec.yaml ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::error::ios/ 不存在，无法打包"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.probe.outputs.found == 'true'
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: 显示 Xcode 版本
        if: steps.probe.outputs.found == 'true'
        run: xcodebuild -version

      - name: pub get
        if: steps.probe.outputs.found == 'true'
        run: flutter pub get

      - name: 构建（无签名）
        if: steps.probe.outputs.found == 'true'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA="--build-number=${{ inputs.build_number }}"
          fi
          flutter build ios --${{ inputs.flavor }} --no-codesign $EXTRA

      - name: 打包成 .ipa
        if: steps.probe.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/ios -name 'Runner.app' -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "找不到 Runner.app"; exit 1; fi
          echo "APP=$APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          # 未签名包：去掉 _CodeSignature，避免 Sideloadly 因签名残留报错
          rm -rf /tmp/ipa/Payload/Runner.app/_CodeSignature || true
          cd /tmp/ipa
          zip -qry VidLog-unsigned.ipa Payload
          ls -lh VidLog-unsigned.ipa
          cp VidLog-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: 上传 .ipa（发到 Release）
        if: steps.probe.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 固定用一个 prerelease 标签，每次覆盖 —— Release 页永远只有最新那一份，
          # 不会像 artifact 那样一条攒一条（攒到 24 条就撞上了配额）。
          # 历史版本靠本地 dist\ 留档。
          TAG=ios-test
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "iOS 测试包（未签名）" \
              --notes "每次打包覆盖同一个 .ipa。真机用 Sideloadly 装；免费 Apple ID 签的 7 天过期，过期重装即可。"
          gh release upload "$TAG" VidLog-unsigned.ipa --clobber
          ls -lh VidLog-unsigned.ipa
          echo "下载页：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
