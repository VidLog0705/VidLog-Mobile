org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ⚠️ 2026-10-01：本机（Windows）上 Kotlin 的**增量编译缓存写不出去** ——
# 报的是 `Could not close incremental caches in build/<plugin>/kotlin/...`，
# 而且**换哪个插件都一样**（先 video_player_android、再 url_launcher_android），
# 所以不是某个插件的问题，是这台机器上那些 `.tab` 文件被谁攥着
#（这个报错最常见的成因是杀毒/索引程序）。
# 关掉增量编译是它公认的解法；代价是每次全量编译，慢一点。
#
# ⚠️ CI（Linux）不需要这一行。留着它是为了让**本机**
# `flutter build apk --debug`（预检的 `-Full` 那一步）能跑通 ——
# 否则本机就永远验不了安卓那一侧的 Kotlin。
kotlin.incremental=false
